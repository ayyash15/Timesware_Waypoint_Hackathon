<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Order Confirmation — Waypoint Store Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<style>
  .sm-top { background: rgba(255,255,255,.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--c-border); padding: var(--sp-4) var(--sp-6); display:flex; justify-content:space-between; align-items:center; position: sticky; top:0; z-index:5; }
  .sm-wrap { max-width: 560px; margin: 0 auto; padding: var(--sp-8) var(--sp-6); display:flex; flex-direction:column; gap: var(--sp-5); text-align:center; animation: wp-rise 460ms cubic-bezier(0.34,1.56,0.64,1) both; }
  .check-ring { width:68px; height:68px; border-radius:50%; background: linear-gradient(135deg, var(--c-success-tint), #d3f0e0); color: var(--c-success); display:flex; align-items:center; justify-content:center; font-size:32px; margin: 0 auto; box-shadow: 0 0 0 6px var(--c-success-tint); animation: wp-rise 500ms cubic-bezier(0.34,1.56,0.64,1) both; }
</style>
<link rel="stylesheet" href="css/wow-premium.css" />
</head>
<body>
  <div class="sm-top">
    <a class="flex gap-2 items-center" href="index.html" style="text-decoration:none; color:inherit;"><div class="avatar" style="background:var(--c-brand);">W</div><strong>Waypoint &middot; Store</strong></a>
    <div class="flex gap-2 items-center"><a href="index.html" aria-label="Home" title="Home" class="btn-icon btn-ghost btn" style="color:var(--c-ink-700);"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5L8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/></svg></a><span class="chip">Fathima &middot; Nugegoda Fresh Corner</span></div>
  </div>
  <div class="sm-wrap">
    <div class="check-ring"><span class="ic-svg" style="display:inline-flex;vertical-align:-2px;"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span></div>
    <h1>Order received</h1>
    <div class="card" style="text-align:left;">
      <div class="flex justify-between" style="margin-bottom:8px;"><span class="muted">Order</span><strong class="mono">ORD-4474</strong></div>
      <div class="flex justify-between" style="margin-bottom:8px;"><span class="muted">Received at</span><strong>3:42 PM</strong></div>
      <div class="flex justify-between"><span class="muted">Status</span><span class="badge badge-warning">Awaiting dispatch planning</span></div>
    </div>
    <p class="muted small">You'll get an expected arrival time once tomorrow's plan is confirmed, usually by early evening.</p>
    <div class="flex gap-2">
      <a class="btn btn-secondary btn-block" href="store-order.html">Place another order</a>
      <a class="btn btn-brand btn-block" href="store-status.html">View delivery status</a>
    </div>
  </div>
<script src="js/wp-live.js"></script>
<script src="js/wow-premium.js"></script>

<script>
(function(){
  if (!window.WOWPremium) return;
  if (WOWPremium.ResponsiveInteractions && WOWPremium.ResponsiveInteractions.init) { WOWPremium.ResponsiveInteractions.init(); }
  if (WOWPremium.CardElevator) { WOWPremium.CardElevator.enhanceCards(".card"); }
  if (WOWPremium.initScrollAnimations) { WOWPremium.initScrollAnimations({ sectionReveal: { scale: 0.96, opacity: 0.8, translateY: 20 } }); }
})();
</script>
</body>
</html>
