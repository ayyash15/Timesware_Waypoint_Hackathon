<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Delivery Status — Waypoint Store Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<style>
  .sm-top { background: rgba(255,255,255,.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--c-border); padding: var(--sp-4) var(--sp-6); display:flex; justify-content:space-between; align-items:center; position: sticky; top:0; z-index:5; }
  .sm-wrap { max-width: 560px; margin: 0 auto; padding: var(--sp-6); display:flex; flex-direction:column; gap: var(--sp-5); animation: wp-rise 420ms cubic-bezier(0.2,0,0,1) both; }
  .eta-big { font-family: var(--f-display); font-size: var(--fs-800); font-weight:700; }
  .steps { display:flex; justify-content:space-between; position:relative; margin: var(--sp-4) 0; }
  .steps::before { content:""; position:absolute; top:11px; left:0; right:0; height:2px; background: var(--c-border); z-index:0; }
  .step { display:flex; flex-direction:column; align-items:center; gap:6px; z-index:1; flex:1; }
  .step .dot { width:22px; height:22px; border-radius:50%; background: var(--c-surface-2); border:2px solid var(--c-border-strong); }
  .step.done .dot { background: var(--c-success); border-color: var(--c-success); }
  .step.active .dot { background: var(--c-brand); border-color: var(--c-brand); }
  .step span.lbl { font-size: var(--fs-100); color: var(--c-ink-500); text-align:center; }
</style>
<link rel="stylesheet" href="css/wow-premium.css" />
</head>
<body>
  <div class="sm-top">
    <a class="flex gap-2 items-center" href="index.html" style="text-decoration:none; color:inherit;"><div class="avatar" style="background:var(--c-brand);">W</div><strong>Waypoint &middot; Store</strong></a>
    <div class="flex gap-2 items-center"><a href="index.html" aria-label="Home" title="Home" class="btn-icon btn-ghost btn" style="color:var(--c-ink-700);"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5L8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/></svg></a><span class="chip">Fathima &middot; Nugegoda Fresh Corner</span></div>
  </div>
  <div class="sm-wrap">
    <div class="page-head"><div><h1>Delivery Status</h1><div class="desc">Order ORD-4474 &middot; for Thu 1 Oct</div></div></div>

    <div class="card" style="text-align:center;">
      <div class="stat-label">Arriving approximately</div>
      <div class="eta-big">6:42 AM</div>
      <div class="steps">
        <div class="step done"><div class="dot"></div><span class="lbl">Planned</span></div>
        <div class="step active"><div class="dot"></div><span class="lbl">In Transit</span></div>
        <div class="step"><div class="dot"></div><span class="lbl">At Outlet</span></div>
        <div class="step"><div class="dot"></div><span class="lbl">Delivered</span></div>
      </div>
    </div>

    <a class="btn btn-brand btn-lg btn-block" href="store-receipt.html">Confirm Receipt (when it arrives)</a>
    <a class="btn btn-secondary btn-block" href="store-deferral.html">See a deferred-order example &rarr;</a>
  </div>
<script src="js/wp-live.js"></script>
<script src="js/wow-premium.js"></script>

<script>
(function(){
  if (!window.WOWPremium) return;
  if (WOWPremium.ResponsiveInteractions && WOWPremium.ResponsiveInteractions.init) { WOWPremium.ResponsiveInteractions.init(); }
  if (WOWPremium.CardElevator) { WOWPremium.CardElevator.enhanceCards(".card"); }
  if (WOWPremium.initScrollAnimations) { WOWPremium.initScrollAnimations({ sectionReveal: { scale: 0.96, opacity: 0.8, translateY: 20 } }); }
})();
</script>
</body>
</html>
