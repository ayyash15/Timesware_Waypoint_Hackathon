<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Confirm Receipt — Waypoint Store Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<style>
  .sm-top { background: rgba(255,255,255,.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--c-border); padding: var(--sp-4) var(--sp-6); display:flex; justify-content:space-between; align-items:center; position: sticky; top:0; z-index:5; }
  .sm-wrap { max-width: 560px; margin: 0 auto; padding: var(--sp-6); display:flex; flex-direction:column; gap: var(--sp-5); animation: wp-rise 420ms cubic-bezier(0.2,0,0,1) both; }
  .compare-row { display:grid; grid-template-columns: 1fr 80px 80px; padding: 10px 0; border-bottom: 1px solid var(--c-border); font-size: var(--fs-200); align-items:center; }
  .compare-row.mismatch { background: var(--c-warning-tint); }
  .compare-head { font-weight:600; color: var(--c-ink-500); }
</style>
<link rel="stylesheet" href="css/wow-premium.css" />
</head>
<body>
  <div class="sm-top">
    <a class="flex gap-2 items-center" href="index.html" style="text-decoration:none; color:inherit;"><div class="avatar" style="background:var(--c-brand);">W</div><strong>Waypoint &middot; Store</strong></a>
    <div class="flex gap-2 items-center"><a href="index.html" aria-label="Home" title="Home" class="btn-icon btn-ghost btn" style="color:var(--c-ink-700);"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5L8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/></svg></a><span class="chip">Fathima &middot; Nugegoda Fresh Corner</span></div>
  </div>
  <div class="sm-wrap">
    <div class="page-head"><div><h1>Confirm Receipt</h1><div class="desc">Order ORD-4474 &middot; delivered 06:47 AM</div></div></div>

    <div class="card">
      <div class="compare-row compare-head"><span>Item</span><span>Ordered</span><span>Received</span></div>
      <div class="compare-row"><span>Dairy cases</span><span>12</span><span>12</span></div>
      <div class="compare-row"><span>Produce crates</span><span>8</span><span>8</span></div>
      <div class="compare-row mismatch"><span>Frozen goods cases</span><span>4</span><span style="color:var(--c-danger); font-weight:700;">3</span></div>
    </div>

    <div class="flex gap-2">
      <button class="btn btn-success btn-lg btn-block" id="confirm-btn"><span class="ic-svg" style="display:inline-flex;vertical-align:-2px;"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span> Confirm Receipt</button>
    </div>
    <button class="btn btn-secondary btn-block" id="discrepancy-btn">Report discrepancy</button>

    <div id="issue-panel" style="display:none;">
      <div class="card">
        <div class="card-title">Issue type</div>
        <div class="flex-col gap-2">
          <label class="chip" style="cursor:pointer; justify-content:flex-start;"><input type="radio" name="issue" style="margin-right:8px;">Missing item</label>
          <label class="chip" style="cursor:pointer; justify-content:flex-start;" checked><input type="radio" name="issue" checked style="margin-right:8px;">Short quantity — frozen goods</label>
          <label class="chip" style="cursor:pointer; justify-content:flex-start;"><input type="radio" name="issue" style="margin-right:8px;">Damaged item</label>
          <label class="chip" style="cursor:pointer; justify-content:flex-start;"><input type="radio" name="issue" style="margin-right:8px;">Wrong item</label>
        </div>
        <button class="btn btn-brand btn-block" style="margin-top:var(--sp-4);" onclick="toast('Discrepancy reported to dispatcher', 'success')">Submit report</button>
      </div>
    </div>
  </div>

<script src="js/wp-live.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("confirm-btn").addEventListener("click", () => toast("Receipt confirmed", "success"));
  document.getElementById("discrepancy-btn").addEventListener("click", () => {
    document.getElementById("issue-panel").style.display = "block";
  });
</script>
<script src="js/wow-premium.js"></script>

<script>
(function(){
  if (!window.WOWPremium) return;
  if (WOWPremium.ResponsiveInteractions && WOWPremium.ResponsiveInteractions.init) { WOWPremium.ResponsiveInteractions.init(); }
  if (WOWPremium.CardElevator) { WOWPremium.CardElevator.enhanceCards(".card"); }
  if (WOWPremium.initScrollAnimations) { WOWPremium.initScrollAnimations({ sectionReveal: { scale: 0.96, opacity: 0.8, translateY: 20 } }); }
})();
</script>
</body>
</html>
