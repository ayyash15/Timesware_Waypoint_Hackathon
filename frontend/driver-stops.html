<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Today's Stops — Waypoint Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />
<style>
  body { background: var(--c-ink-900); }
  .phone-top { background: var(--c-navy-grad); border-bottom: none; color: #fff; }
  .phone-top .muted { color: #8b96a1 !important; }
  .stop-tile { background: var(--c-surface-0); border-radius: var(--r-lg); padding: var(--sp-5); border: 1px solid var(--c-border); box-shadow: var(--sh-1); transition: box-shadow var(--dur-med) var(--ease), transform var(--dur-med) var(--ease); }
  .stop-tile.current { border-color: var(--c-brand); box-shadow: 0 0 0 3px var(--c-brand-tint), var(--sh-2); }
  .stop-tile.done { opacity: 0.75; }
  .stop-tile .num { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family: var(--f-display); font-weight:700; flex-shrink:0; }
  .stop-tile.current .num { background: var(--c-brand-grad); color:#fff; box-shadow: var(--sh-brand); }
  .stop-tile.done .num { background: var(--c-success-tint); color: var(--c-success); }
  .stop-tile.upcoming .num { background: var(--c-surface-2); color: var(--c-ink-500); }
  #stops { gap: var(--sp-3); display: flex; flex-direction: column; }
  .route-progress { padding: 0 var(--sp-1) var(--sp-2); }
  .route-progress .lbl { display:flex; justify-content:space-between; font-size: var(--fs-100); color:#8b96a1; margin-bottom:6px; }
</style>
<link rel="stylesheet" href="css/wow-premium.css" />
</head>
<body>
<div class="phone-frame">
  <div id="offline-bar" class="offline-bar">OFFLINE — 3 records waiting to sync</div>
  <div class="phone-top">
    <div class="flex justify-between items-center">
      <div>
        <div class="small muted">Ruwan Perera &middot; VEH014</div>
        <h1 style="font-size:var(--fs-500);">Colombo Fresh &middot; Trip 1</h1>
      </div>
      <div class="flex gap-2 items-center">
        <a href="index.html" aria-label="Home" title="Home" class="btn-icon btn-ghost btn" style="color:inherit;"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5L8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/></svg></a>
        <div class="avatar">RP</div>
      </div>
    </div>
    <div class="route-progress" style="margin-top:14px;">
      <div class="lbl"><span>Route progress</span><span id="route-progress-txt"></span></div>
      <div class="progress"><span id="route-progress-fill" style="width:0%"></span></div>
    </div>
  </div>
  <div class="phone-body" id="stops"></div>
</div>

<script src="js/wp-live.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  simulateOfflineCycle("offline-bar");
  const cls = s => s === "Current" ? "current" : s === "Done" ? "done" : "upcoming";
  document.getElementById("stops").innerHTML = WP_DATA.driverStops.map(s => `
    <div class="stop-tile ${cls(s.status)} flex justify-between items-center">
      <div class="flex gap-3 items-center">
        <div class="num">${s.status === 'Done' ? '<span class="ic-svg" style="display:inline-flex;vertical-align:-2px;"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span>' : s.seq}</div>
        <div>
          <div style="font-weight:700;">${s.outlet}</div>
          <div class="small muted">ETA ${s.eta} &middot; window ${s.window}</div>
        </div>
      </div>
      ${s.status === 'Current' ? `<a class="btn btn-brand" href="driver-stop-detail.html">START STOP</a>` : ''}
      ${s.status === 'Done' ? `<span class="badge badge-success">Delivered</span>` : ''}
      ${s.status === 'Upcoming' ? `<span class="badge badge-neutral">Waiting</span>` : ''}
    </div>`).join("");

  const total = WP_DATA.driverStops.length;
  const doneCount = WP_DATA.driverStops.filter(s => s.status === "Done").length;
  document.getElementById("route-progress-txt").textContent = `${doneCount} of ${total} stops`;
  requestAnimationFrame(() => { document.getElementById("route-progress-fill").style.width = `${Math.round((doneCount/total)*100)}%`; });
</script>
<script src="js/wow-premium.js"></script>

<script>
(function(){
  if (!window.WOWPremium) return;
  if (WOWPremium.ResponsiveInteractions && WOWPremium.ResponsiveInteractions.init) { WOWPremium.ResponsiveInteractions.init(); }
  if (WOWPremium.initScrollAnimations) { WOWPremium.initScrollAnimations({ sectionReveal: { scale: 0.96, opacity: 0.8, translateY: 20 } }); }
})();
</script>
</body>
</html>
